repos:
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  - repo: local
    hooks:
      - id: stylua
        name: StyLua
        entry: python scripts/pre_commit_tool.py stylua
        language: python
        types: []
        files: \.luau?$
      - id: selene
        name: selene
        entry: python scripts/pre_commit_tool.py selene
        language: python
        files: \.luau?$
