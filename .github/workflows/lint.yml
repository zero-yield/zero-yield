name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Run selene
        run: selene source
