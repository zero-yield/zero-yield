name: PR Build

on:
  pull_request:
    branches:
      - master
      - next
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  actions: write

jobs:
  build:
    if: github.actor != 'renovate[bot]' && github.event.pull_request.user.login != 'renovate[bot]' && !startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Get short commit hash
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1

      - name: Prepare source
        run: |
          mkdir -p /tmp/prbuild

          # Bundle modules into single file (readable, unminified)
          darklua process src/init.luau /tmp/prbuild/source.luau

      - name: Minify source with DarkLua
        run: |
          darklua process \
            -c .darklua.min.json5 \
            src/init.luau \
            /tmp/prbuild/source.min.luau

      - name: Upload PR build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-${{ steps.vars.outputs.sha_short }}
          path: |
            /tmp/prbuild/source.luau
            /tmp/prbuild/source.min.luau
          retention-days: 14
