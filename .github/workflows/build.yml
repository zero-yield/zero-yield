name: Devbuild

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Get short commit hash
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup darklua
        uses: jacklebeignet/setup-darklua@ab6bcdae45d364076e6ad3a1af51351c84fc0cec # v1
        with:
          version: latest

      - name: Prepare source
        run: |
          mkdir -p /tmp/devbuild

          # Copy the original source
          cp source /tmp/devbuild/source.luau

      - name: Minify source with DarkLua
        run: |
          darklua process \
            /tmp/devbuild/source.luau \
            /tmp/devbuild/source.min.luau

      - name: Commit build to builds branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch builds branch if it exists
          git fetch origin builds:builds || true

          # Switch to builds branch or create it
          git checkout builds 2>/dev/null || git checkout --orphan builds

          # Remove everything except .git
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          # Copy both builds
          cp /tmp/devbuild/source.luau .
          cp /tmp/devbuild/source.min.luau .

          # Only keep .luau files
          find . -type f \
            ! -name '*.luau' \
            ! -path './.git/*' \
            -delete

          # Stage changes
          git add --all

          # Don't create an empty commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Commit
          git commit \
            -m "Build ${{ steps.vars.outputs.sha_short }}"

          # Push
          git push https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git builds
