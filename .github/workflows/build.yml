name: Devbuild

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Get short commit hash
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install DarkLua
        run: |
          curl -L -o darklua.zip \
            https://github.com/seaofvoices/darklua/releases/latest/download/darklua-linux-x86_64.zip

          unzip -q darklua.zip -d darklua-bin

          sudo mv darklua-bin/darklua /usr/local/bin/darklua

          darklua --version

      - name: Prepare source
        run: |
          mkdir -p /tmp/devbuild

          cp source /tmp/devbuild/source.luau

      - name: Minify source with DarkLua
        run: |
          darklua process \
            /tmp/devbuild/source.luau \
            /tmp/devbuild/source.min.luau

      - name: Commit build to builds branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch builds branch if it exists
          git fetch origin builds:builds || true

          # Switch to builds branch or create it
          git checkout builds 2>/dev/null || git checkout --orphan builds

          # Remove everything except .git
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          # Copy the generated .luau file
          cp /tmp/devbuild/source.min.luau source.luau

          # Make sure only .luau files are committed
          git add --all

          git add '*.luau' 2>/dev/null || true

          # Remove anything that isn't a .luau file from Git
          for file in $(git ls-files); do
            if [[ "$file" != *.luau ]]; then
              git rm -f -- "$file"
            fi
          done

          git add '*.luau' 2>/dev/null || true

          git commit \
            -m "Build ${{ steps.vars.outputs.sha_short }}" \
            --allow-empty

          git push origin builds
