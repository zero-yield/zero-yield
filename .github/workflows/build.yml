name: Devbuild

on:
  push:
    branches:
      - next

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git CLI
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Get short commit hash
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1

      - name: Prepare source
        run: |
          mkdir -p /tmp/devbuild

          # Bundle modules into single file (readable, unminified)
          darklua process src/init.luau /tmp/devbuild/source.luau

      - name: Minify source with DarkLua
        run: |
          darklua process \
            -c .darklua.min.json5 \
            --format dense \
            src/init.luau \
            /tmp/devbuild/source.min.luau

      - name: Commit build to builds branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Fetch builds branch if it exists
          git fetch origin builds:builds || true

          # Switch to builds branch or create it
          git checkout builds 2>/dev/null || git checkout --orphan builds

          # Remove everything except .git
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          # Copy both builds
          cp /tmp/devbuild/source.luau .
          cp /tmp/devbuild/source.min.luau .

          # Only keep .luau files
          find . -type f \
            ! -name '*.luau' \
            ! -path './.git/*' \
            -delete

          # Stage changes
          git add --all

          # Don't create an empty commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Commit
          git commit \
            -m "Build ${{ steps.vars.outputs.sha_short }}"

          # Push
          git push origin builds
