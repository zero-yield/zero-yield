name: Devbuild

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Get short commit hash
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: jacklebeignet/setup-darklua@v1
        with:
          version: latest
      
      - name: Prepare source
        run: |
          mkdir -p /tmp/devbuild

          # Copy the original source
          cp source /tmp/devbuild/source.luau

      - name: Minify source with DarkLua
        run: |
          darklua process \
            /tmp/devbuild/source.luau \
            /tmp/devbuild/source.min.luau

      - name: Commit build to builds branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch builds branch if it exists
          git fetch origin builds:builds || true

          # Switch to builds branch or create it
          git checkout builds 2>/dev/null || git checkout --orphan builds

          # Remove everything except .git
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          # Copy both builds
          cp /tmp/devbuild/source.luau .
          cp /tmp/devbuild/source.min.luau .

          # Only keep .luau files
          find . -type f \
            ! -name '*.luau' \
            ! -path './.git/*' \
            -delete

          # Stage changes
          git add --all

          # Don't create an empty commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Commit
          git commit \
            -m "Build ${{ steps.vars.outputs.sha_short }}"

          # Push
          git push origin builds
