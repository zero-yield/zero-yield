name: Bug Report
description: Report a bug or unexpected behavior in Zero Yield.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        Please make sure this issue has not already been reported before submitting.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the bug and what happened.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the steps required to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console Output / Logs
      description: If applicable, provide relevant console output or error messages.
      render: text

  - type: input
    id: executor
    attributes:
      label: Executor
      description: Which executor are you using?
      placeholder: e.g. Volt, Delta, Potassium

  - type: input
    id: version
    attributes:
      label: Zero Yield Version
      description: Which version of Zero Yield are you using?
      placeholder: e.g. 6.6.1

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add anything else that may help us investigate the issue.
